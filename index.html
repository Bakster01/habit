<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Practice the ideas from Atomic Habits with 20 scenario questions and chapter-by-chapter progress.">
  <meta name="theme-color" content="#f8f5ed">
  <title>Habit Practice — Atomic Habits</title>
  <style>
    :root{color-scheme:light;--paper:#f8f5ed;--ink:#112c1d;--green:#164728;--sage:#e5ead8;--line:#bdc7b4;--muted:#47604d;--gold:#c0a521;--white:#fffefa;--sans:system-ui,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.5 var(--sans)}
    button,a{-webkit-tap-highlight-color:transparent}
    button{font:inherit;cursor:pointer;color:inherit}
    a{color:var(--green);text-underline-offset:.22em}
    :focus-visible{outline:3px solid #8c6e04;outline-offset:4px}
    [hidden]{display:none!important}
    .wrap{width:min(1320px,calc(100% - 64px));margin-inline:auto}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid #849886}
    .brand{display:flex;align-items:center;gap:12px;font:bold clamp(1.2rem,3vw,1.95rem)/1 Georgia,serif;text-decoration:none}
    .mark{display:grid;place-items:center;width:42px;height:42px;border-radius:11px;background:var(--green);color:white;flex:none}
    .mark svg{width:27px;height:27px}
    nav{display:flex;gap:8px}
    nav button,.action{border:1px solid transparent;background:transparent;border-radius:9px;padding:8px 14px;font-weight:650}
    nav [aria-current="page"],.primary{background:var(--green);color:white}
    .hero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px;min-height:290px;padding:21px 25px}
    h1,h2,h3{font-family:Georgia,serif;line-height:1.12;margin:0}
    h1{font-size:clamp(2.5rem,6.3vw,6rem);letter-spacing:-.055em}
    .hero p{font:clamp(1.15rem,2.2vw,1.7rem)/1.4 Georgia,serif;margin:.7rem 0 0}
    .hero-copy::after{content:"";display:block;width:76px;height:3px;background:var(--gold);margin-top:22px}
    .diagram{width:clamp(205px,24vw,310px);margin-right:clamp(0px,5vw,72px);color:var(--green)}
    .grid{display:grid;grid-template-columns:minmax(0,1.82fr) minmax(265px,1fr);gap:18px;align-items:start}
    .card{background:var(--white);border:1px solid #637d67;border-radius:15px;padding:clamp(18px,2.6vw,33px);min-width:0}
    .sidebar{background:var(--sage);border-radius:15px;padding:clamp(16px,2vw,25px)}
    .sidebar h2,.card h2{font-size:clamp(1.55rem,3vw,2.35rem)}
    .sidebar p{margin:5px 0 13px;color:var(--muted)}
    .sidebar .small{font-size:.84rem;margin-bottom:0}
    .progress-line{display:flex;align-items:center;gap:14px;margin-bottom:17px;color:var(--muted);font-size:.86rem;font-weight:650}
    progress{width:100%;height:10px;appearance:none;overflow:hidden;border:0;border-radius:12px;background:#e1e8d9;color:var(--green)}
    progress::-webkit-progress-bar{background:#e1e8d9;border-radius:12px}
    progress::-webkit-progress-value{background:var(--green);border-radius:12px}
    progress::-moz-progress-bar{background:var(--green);border-radius:12px}
    #position{white-space:nowrap}
    .kicker{margin:0 0 7px;color:var(--muted);font-size:.85rem;font-weight:700}
    .chapter-source{margin:9px 0 0;font-size:.86rem}
    .choices{display:grid;gap:9px;margin:19px 0 0}
    .choice{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;min-height:51px}
    .choice:hover,.topic:hover,.chapter:hover{border-color:var(--green)}
    .choice:has(input:checked){border-color:#768648;background:#f4f3dc}
    .choice.correct{border-color:#53815d;background:#e8f2e4}
    .choice.incorrect{border-color:#a65040;background:#f9eae3}
    .choice:has(input:disabled){cursor:default}
    .choice input{accent-color:var(--green);width:17px;height:17px;margin:0}
    .letter{display:grid;place-items:center;border-radius:7px;width:30px;height:30px;background:var(--sage);font:bold 1.05rem Georgia,serif}
    .choice:has(input:checked) .letter{background:var(--green);color:white}
    .footer-actions{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;margin-top:17px}
    .action{min-height:42px;border-color:#a2b19b}
    .action.primary{border-color:var(--green)}
    .action:hover:not(:disabled){filter:brightness(.92)}
    .action:disabled{background:#e2e9df;color:#4f6454;border-color:transparent;cursor:default}
    .feedback{margin:16px 0 0;padding:11px 14px;border-left:3px solid #78916e;background:#eff3e9;border-radius:0 6px 6px 0}
    .feedback p{margin:3px 0 0}
    .topics{display:grid;gap:6px}
    .topic{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:11px;text-align:left;border:1px solid transparent;border-radius:10px;background:#f6f7eb;padding:8px 10px;width:100%;min-height:54px}
    .topic[aria-pressed="true"]{border-color:#78896d;background:#fffef5}
    .topic-icon{width:22px;height:22px;color:var(--green)}
    .topic strong{display:block;font:bold 1.12rem Georgia,serif}
    .topic small{display:block;color:var(--muted);font-size:.72rem}
    .count{white-space:nowrap;font-size:.8rem;font-variant-numeric:tabular-nums}
    .sidebar .action{margin-top:11px;width:100%}
    .learn-list{display:grid;gap:10px;margin-top:18px}
    .chapter{border:1px solid var(--line);border-radius:9px;padding:10px 12px}
    .chapter summary{cursor:pointer;font-weight:650}
    .chapter p{margin:10px 0}
    .chapter .action{margin-bottom:3px}
    .score{margin:15px 0 0}
    footer{margin-top:23px;margin-bottom:25px;border-top:1px solid #849886;padding:12px 0;color:var(--muted);font-size:.86rem}
    @media(max-width:780px){.wrap{width:calc(100% - 32px)}.hero{min-height:215px;padding:20px 5px}.diagram{width:150px;margin:0}.grid{grid-template-columns:1fr}.sidebar{grid-row:auto}}
    @media(max-width:470px){header{gap:6px}.mark{width:33px;height:33px}.mark svg{width:22px;height:22px}.brand{gap:7px}nav{gap:2px}nav button{padding:6px 8px}.hero{grid-template-columns:1fr;min-height:0;padding:23px 3px}.diagram{display:none}.hero-copy::after{margin-top:15px}.choice{gap:9px}}
  </style>
</head>
<body>
  <header class="wrap">
    <a class="brand" href="index.html">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="currentColor"><path d="M15 26v-9C7 19 3 13 2 7c7 0 12 3 14 9C18 10 23 7 30 7c-1 7-6 12-13 11v8z"/></svg></span>
      Habit Practice
    </a>
    <nav aria-label="Main navigation">
      <button id="learn-nav" type="button">Learn</button>
      <button id="practice-nav" type="button" aria-current="page">Practice</button>
    </nav>
  </header>
  <main class="wrap">
    <section class="hero" aria-labelledby="title">
      <div class="hero-copy">
        <h1 id="title">Build better habits.</h1>
        <p>Practice the ideas from <em>Atomic Habits</em>, one decision at a time.</p>
      </div>
      <svg class="diagram" viewBox="0 0 300 270" role="img" aria-label="The habit loop: cue, craving, response, reward">
        <circle cx="150" cy="135" r="123" fill="none" stroke="#c0a521" stroke-width="3.6" stroke-dasharray="0.1 10" stroke-linecap="round"/>
        <g fill="#f8f5ed" fill-opacity=".8" stroke="currentColor" stroke-width="1.5">
          <circle cx="150" cy="72" r="64"/><circle cx="223" cy="135" r="64"/>
          <circle cx="150" cy="198" r="64"/><circle cx="77" cy="135" r="64"/>
        </g>
        <g text-anchor="middle" fill="currentColor" font-family="Georgia, serif" font-size="18" font-weight="bold">
          <text x="150" y="53">Cue</text><text x="240" y="140">Craving</text>
          <text x="150" y="225">Response</text><text x="60" y="140">Reward</text>
        </g>
        <circle cx="150" cy="135" r="24" fill="#c0a521"/>
        <path fill="#fffefa" d="M149 148v-12c-8 0-13-4-14-10 8 0 13 3 15 9 2-6 7-9 15-9-1 6-6 10-14 10v12z"/>
      </svg>
    </section>
    <div class="grid">
      <section class="card" id="practice-panel" aria-label="Practice question">
        <div class="progress-line"><progress id="session-progress" aria-label="Session progress"></progress><span id="position"></span></div>
        <p class="kicker" id="chapter-label"></p>
        <h2 id="question-title" tabindex="-1"></h2>
        <form id="question-form">
          <p class="chapter-source"><a id="chapter-summary-link" target="_blank" rel="noopener noreferrer">Read Dan Silvestre’s summary for this chapter ↗</a></p>
          <div class="choices" id="choices" role="radiogroup" aria-labelledby="question-title"></div>
          <div class="feedback" id="feedback" role="status" hidden></div>
          <div class="footer-actions">
            <button type="submit" class="action primary" id="check" disabled>Check answer</button>
            <button type="button" class="action primary" id="next" hidden>Next question →</button>
          </div>
        </form>
        <div id="result" hidden>
          <p class="score" id="score"></p>
          <div class="footer-actions">
            <button type="button" class="action" id="restart">Practice again</button>
            <button type="button" class="action primary" id="continue-book">Continue book →</button>
          </div>
        </div>
      </section>
      <section class="card" id="learn-panel" aria-labelledby="learn-title" hidden>
        <h2 id="learn-title" tabindex="-1">Chapter notes</h2>
        <div class="learn-list" id="notes"></div>
      </section>
      <aside class="sidebar" aria-labelledby="progress-title">
        <h2 id="progress-title">Book progress</h2>
        <p id="book-count"></p>
        <div class="topics" id="topics"></div>
        <button id="review" class="action" type="button" disabled>Review mistakes</button>
        <p class="small" id="storage-status">Progress is saved in this browser.</p>
      </aside>
    </div>
  </main>
  <footer class="wrap">
    Based on <em>Atomic Habits</em>.
    <a href="https://jamesclear.com/atomic-habits-summary">James Clear’s summary</a> ·
    <a href="https://dansilvestre.com/summaries/atomic-habits-james-clear/">Dan Silvestre’s chapter notes</a>
  </footer>
  <script>
  "use strict";
  // Each chapter has its book title, a scenario, four choices, a correct choice index and a takeaway.
  const chapters = [
    ["The Surprising Power of Atomic Habits", "Nora wants to finish twelve books this year. Which option gives her a system?", [
      "Raise her yearly target to fifteen books.", "Read for ten minutes after breakfast every day.", "Check the total on the last day of each month.", "Buy all twelve books up front."
    ], 1, "A system is a repeatable process. Reading after breakfast creates the regular practice that can produce the result."],
    ["How Your Habits Shape Your Identity (and Vice Versa)", "Liam wants to see himself as someone who writes regularly. What gives him the strongest evidence this week?", [
      "Set a deadline for his first novel.", "Buy a notebook used by a favorite author.", "Describe himself as a writer on his profile.", "Write one paragraph every morning."
    ], 3, "Small completed actions give Liam evidence that he is becoming the kind of person he wants to be."],
    ["How to Build Better Habits in 4 Simple Steps", "A phone buzzes. Ava wants to know who messaged. She checks the screen and feels relieved. What is the craving?", [
      "Wanting to know who messaged.", "Feeling the phone buzz.", "Checking the screen.", "Feeling relieved."
    ], 0, "The buzz is the cue, the wish to know is the craving, checking is the response, and relief is the reward."],
    ["The Man Who Didn’t Look Right", "Theo opens a shopping app without thinking during work breaks. What should he try first to identify the trigger?", [
      "Choose a weekly spending limit.", "Reward himself for days with zero purchases.", "Record when he opens it and what happened just before.", "Replace the app with a different retailer."
    ], 2, "Recording the behavior and its context makes the automatic pattern visible and gives Theo a cue he can change."],
    ["The Best Way to Start a New Habit", "Which plan attaches a new action to an existing habit?", [
      "At 7 a.m. I’ll stretch in the living room.", "After I pour my morning coffee, I’ll stretch for one minute.", "I’ll stretch four times this week.", "I’ll stretch whenever I feel stiff."
    ], 1, "Habit stacking uses something you reliably do already as the signal to start the new action."],
    ["Motivation Is Overrated; Environment Often Matters More", "Jules keeps forgetting to bring a reusable bag to the grocery store. Which change gives the clearest cue at the right moment?", [
      "Hang the bag beside the keys used to leave for the store.", "Keep the bag in a labeled box in the attic.", "Add reusable bags to a list of long-term goals.", "Buy a higher-quality bag and keep it inside its packaging."
    ], 0, "Put a visible prompt where the decision happens. Seeing the bag next to the keys makes the next action easier to remember."],
    ["The Secret to Self-Control", "A news alert often leads Maya to scroll during class. Which change directly reduces exposure to the cue?", [
      "Sign out after every scrolling session.", "Ask a classmate to check her screen time.", "Reward herself after a focus session.", "Turn off news alerts during class."
    ], 3, "Removing or hiding the trigger reduces how often Maya has to resist the urge to check."],
    ["How to Make a Habit Irresistible", "Ezra wants to walk more and looks forward to a favorite audiobook. Which plan pairs the two activities?", [
      "Listen to the audiobook during his regular walk.", "Listen to the audiobook, then decide whether to walk.", "Write his walking target on the book’s cover.", "Buy an audiobook after walking every day for a year."
    ], 0, "Pair an activity you want to do with the one you want to repeat. Anticipating the audiobook makes starting the walk more appealing."],
    ["The Role of Family and Friends in Shaping Your Habits", "Bea wants to speak Spanish more often. Which group best supports the habit?", [
      "A book club that discusses Spanish novels in English.", "A group for learners at her level who converse in Spanish weekly.", "An advanced group she can only observe.", "A travel forum that rarely discusses language practice."
    ], 1, "A group where the desired behavior is normal provides repeated opportunities and makes the behavior feel like part of belonging."],
    ["How to Find and Fix the Causes of Your Bad Habits", "After hard meetings, Raj scrolls for a break. Which thought reframes a short walk as an appealing replacement?", [
      "I’ll move my phone farther away.", "I’ll track which meetings lead to scrolling.", "A walk will give me a real pause and I can return with a clear head.", "I’ll ask a coworker to check up on me."
    ], 2, "Find the change in feeling the habit delivers, then highlight how another action can meet that need."],
    ["Walk Slowly, but Never Backward", "Iris wants writing to feel more automatic. Which activity gives her direct practice?", [
      "Compare three writing apps.", "Create a spreadsheet of possible themes.", "Watch a video about writing routines.", "Draft a short paragraph each afternoon."
    ], 3, "Repetition of the target behavior builds fluency. Planning may prepare Iris to write, and drafting gives her actual practice."],
    ["The Law of Least Effort", "Ana skips evening workouts because getting to the gym means an extra bus ride. What most directly reduces the friction?", [
      "Set a more ambitious workout goal.", "Pick a gym she passes on the way home.", "Promise a bigger reward after each session.", "Invite a friend to check whether she went."
    ], 1, "A gym already on the route removes an extra step every time Ana wants to train."],
    ["How to Stop Procrastinating by Using the Two-Minute Rule", "Sam keeps putting off a half-hour guitar session. Which version best applies the Two-Minute Rule?", [
      "Sit down, pick up the guitar, and play one chord.", "Schedule a one-hour session on weekends.", "Read about guitar practice for two minutes.", "Buy a second guitar for the living room."
    ], 0, "Shrink the beginning of the desired habit so it is easy to start. Playing one chord is already a tiny version of practicing guitar."],
    ["How to Make Good Habits Inevitable and Bad Habits Impossible", "Mina wants to stop video streaming from taking over planned study time. Which choice constrains her future options in advance?", [
      "Write down how much time she streams.", "Set a reminder to think about her priorities.", "Schedule a site block during study hours with a passcode held by a friend.", "Plan to reward herself after a week of studying."
    ], 2, "A commitment device makes a future choice harder to reverse while you are still in a position to set it up."],
    ["The Cardinal Rule of Behavior Change", "Owen wants to cook at home to save money over the year. Which action adds an immediate reward that supports the goal?", [
      "Wait until December to calculate the savings.", "Compare his grocery budget with a friend’s budget.", "Raise his savings target after every meal.", "Move a small amount to a vacation fund right after each home-cooked dinner."
    ], 3, "An immediate, compatible reward gives Owen a reason to feel good about repeating the action while the long-term benefit builds."],
    ["How to Stick with Good Habits Every Day", "Liv usually journals each evening but missed yesterday. What is the best response tonight?", [
      "Write twice as much tomorrow to make up for it.", "Write one sentence tonight and return to the routine.", "Wait for the next week to start a clean streak.", "Replace journaling with a new habit before trying again."
    ], 1, "Recover on the next opportunity. A small version lets Liv return to the pattern without making the missed day harder to overcome."],
    ["How an Accountability Partner Can Change Everything", "Tariq wants to stop arriving late to a weekly study group. Which plan creates immediate accountability?", [
      "Track his average arrival time privately at the end of the year.", "Pick a new goal for his overall grades.", "Agree to text his partner when he arrives and take cleanup duty if he’s late.", "Pack his bag the night before."
    ], 2, "An agreed consequence and another person who can check follow-through give the choice a cost in the present."],
    ["The Truth About Talent (When Genes Matter and When They Don’t)", "Mara wants to exercise consistently. She enjoys hiking and dislikes competitive classes. Which experiment gives her a good starting fit?", [
      "Try a regular route that uses her enjoyment of hiking and builds on her current stamina.", "Join the hardest class because it works for a friend.", "Pick a different activity every session without noting what she enjoys.", "Choose an exercise solely because it burns the most calories."
    ], 0, "Choose a version that fits your interests and abilities, then adjust based on what you can sustain."],
    ["The Goldilocks Rule: How to Stay Motivated in Life and Work", "Dev can easily solve beginner chess puzzles and finds expert puzzles overwhelming. Which set is most likely to keep him engaged?", [
      "The same beginner puzzles he has memorized.", "Expert puzzles he cannot begin to solve.", "Random puzzles with no feedback or difficulty level.", "Puzzles one level above his current comfort zone."
    ], 3, "A manageable stretch offers enough challenge to hold attention while still making progress possible."],
    ["The Downside of Creating Good Habits", "Ren has practiced piano at the same pace for months and keeps making the same mistake. What would help improve beyond that routine?", [
      "Extend the session but repeat the piece the same way.", "Review a recording, isolate the tricky passage, and practice it with feedback.", "Track only the number of days practiced.", "Switch to a different instrument each week."
    ], 1, "Review reveals where a fluent routine is hiding errors. Deliberate practice lets Ren work directly on the part that needs improvement."]
  ];
  const danSummaryUrl = "https://dansilvestre.com/summaries/atomic-habits-james-clear/";
  const chapterSummaryFragments = [
    "Chapter_1_The_Surprising_Power_of_Atomic_Habits",
    "Chapter_2_How_Your_Habits_Shape_Your_Identity_and_Vice_Versa",
    "Chapter_3_How_to_Build_Better_Habits_in_4_Simple_Steps",
    "Chapter_4_The_Man_Who_Didnt_Look_Right",
    "Chapter_5_The_Best_Way_to_Start_a_New_Habit",
    "Chapter_6_Motivation_Is_Overrated_Environment_Often_Matters_More",
    "Chapter_7_The_Secret_to_Self-Control",
    "Chapter_8_How_to_Make_a_Habit_Irresistible",
    "Chapter_9_The_Role_of_Family_and_Friends_in_Shaping_Your_Habits",
    "Chapter_10_How_to_Find_and_Fix_the_Causes_of_Your_Bad_Habits",
    "Chapter_11_Walk_Slowly_but_Never_Backward",
    "Chapter_12_The_Law_of_Least_Effort",
    "Chapter_13_How_to_Stop_Procrastinating_by_Using_the_Two-Minute_Rule",
    "Chapter_14_How_to_Make_Good_Habits_Inevitable_and_Bad_Habits_Impossible",
    "Chapter_15_The_Cardinal_Rule_of_Behavior_Change",
    "Chapter_16_How_to_Stick_with_Good_Habits_Every_Day",
    "Chapter_17_How_an_Accountability_Partner_Can_Change_Everything",
    "Chapter_18_The_Truth_About_Talent_When_Genes_Matter_and_When_They_Dont",
    "Chapter_19_The_Goldilocks_Rule_How_to_Stay_Motivated_in_Life_and_Work",
    // Chapter 20 has no anchor of its own. Keep the preceding heading as a fallback.
    "Chapter_19_The_Goldilocks_Rule_How_to_Stay_Motivated_in_Life_and_Work:~:text=" +
      encodeURIComponent("Chapter 20: The Downside of Creating Good Habits")
  ];
  const groups = [
    { title: "Foundations", summary: "Systems, identity, and the habit loop", icon: "book", start: 0, end: 3 },
    { title: "Make it obvious", summary: "Notice and design cues", icon: "eye", start: 3, end: 7 },
    { title: "Make it attractive", summary: "Increase the appeal of a habit", icon: "heart", start: 7, end: 10 },
    { title: "Make it easy", summary: "Reduce the effort to start", icon: "bolt", start: 10, end: 14 },
    { title: "Make it satisfying", summary: "Reinforce the behavior", icon: "gift", start: 14, end: 17 },
    { title: "Advanced practice", summary: "Fit, challenge, and reflection", icon: "target", start: 17, end: 20 }
  ];
  const iconPaths = {
    book: '<path d="M12 6c-3-2-6-2-9-1v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1v14"/>',
    eye: '<path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/>',
    heart: '<path d="M12 20s-9-5.5-9-11a4.5 4.5 0 0 1 9-1 4.5 4.5 0 0 1 9 1c0 5.5-9 11-9 11Z"/>',
    bolt: '<path d="m13 2-9 12h7l-1 8 10-12h-7l1-8Z"/>',
    gift: '<path d="M4 10h16v11H4zM2 6h20v4H2zM12 6v15m0-15c-1-5-7-5-6 0m6 0c1-5 7-5 6 0"/>',
    target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>'
  };
  const book = chapters.map((chapter, index) => index);
  const storageKey = "habit-practice-v1";
  const el = id => document.getElementById(id);
  let storageAvailable = true;
  let view = "practice";
  let selected = null;

  function makeSession(kind, ids) {
    return { kind, ids, answers: [], cursor: 0 };
  }

  function readProgress() {
    const empty = { mastery: {}, session: makeSession("book", book) };
    try {
      const raw = localStorage.getItem(storageKey);
      if (!raw) return empty;
      const { mastery, session } = JSON.parse(raw);
      const validChoice = choice => Number.isInteger(choice) && choice >= 0 && choice < 4;
      if (!mastery || typeof mastery !== "object" || !session ||
          !Array.isArray(session.ids) || !session.ids.length ||
          !session.ids.every(id => book.includes(id)) ||
          !Array.isArray(session.answers) || !session.answers.every(validChoice) ||
          !Number.isInteger(session.cursor) || session.cursor < 0 ||
          session.cursor > session.ids.length ||
          session.answers.length < session.cursor ||
          session.answers.length > Math.min(session.cursor + 1, session.ids.length)) return empty;
      return { mastery, session };
    } catch (error) {
      if (error instanceof SyntaxError || error instanceof TypeError) return empty;
      storageAvailable = false;
      return empty;
    }
  }

  let state = readProgress();

  function saveProgress() {
    try {
      localStorage.setItem(storageKey, JSON.stringify(state));
      storageAvailable = true;
    } catch {
      storageAvailable = false;
    }
  }

  function mastered(id) {
    return state.mastery[id] === "correct";
  }

  function mistakes() {
    return book.filter(id => state.mastery[id] === "missed");
  }

  function groupIds(index) {
    const { start, end } = groups[index];
    return book.slice(start, end);
  }

  function activeGroup() {
    const { ids, cursor } = state.session;
    const id = ids[cursor] ?? ids.at(-1);
    return groups.findIndex(group => id >= group.start && id < group.end);
  }

  function makeSidebar() {
    for (const [index, group] of groups.entries()) {
      const button = document.createElement("button");
      button.className = "topic";
      button.type = "button";
      button.innerHTML = '<svg class="topic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        iconPaths[group.icon] + '</svg><span><strong>' + group.title + '</strong><small>' +
        group.summary + '</small></span><span class="count"></span>';
      button.addEventListener("click", () => {
        if (state.session.kind === "topic-" + index && state.session.cursor < state.session.ids.length) {
          showView("practice", true);
          return;
        }
        startSession("topic-" + index, groupIds(index));
      });
      el("topics").append(button);
    }
  }

  function renderSidebar() {
    const done = book.filter(mastered).length;
    el("book-count").textContent = done + " of " + book.length + " chapters mastered";
    for (const [index, button] of [...el("topics").children].entries()) {
      const ids = groupIds(index);
      const doneInGroup = ids.filter(mastered).length;
      const count = button.querySelector(".count");
      count.textContent = doneInGroup + " / " + ids.length + " ›";
      count.setAttribute("aria-label", doneInGroup + " of " + ids.length + " mastered");
      button.setAttribute("aria-pressed", String(view === "practice" && index === activeGroup()));
    }
    const missed = mistakes().length;
    el("review").textContent = missed ? "Review mistakes (" + missed + ")" : "Review mistakes";
    el("review").disabled = missed === 0;
    el("storage-status").textContent = storageAvailable
      ? "Progress is saved in this browser."
      : "Browser storage is unavailable. Progress will last until you close this page.";
  }

  function renderPractice() {
    const { ids, cursor, answers } = state.session;
    const finished = cursor === ids.length;
    const answered = answers.length > cursor;
    const position = Math.min(cursor + 1, ids.length);
    el("session-progress").max = ids.length;
    el("session-progress").value = answers.length;
    el("position").textContent = position + " of " + ids.length;
    el("question-form").hidden = finished;
    el("result").hidden = !finished;
    if (finished) {
      const correct = ids.filter((id, offset) => answers[offset] === chapters[id][3]).length;
      const remaining = book.filter(id => !mastered(id)).length;
      el("chapter-label").textContent = remaining ? "Session complete" : "Book complete";
      el("question-title").textContent = remaining ? "Practice complete." : "You’ve mastered all 20 chapters.";
      el("score").textContent = correct + " of " + ids.length + " correct in this session.";
      el("continue-book").hidden = remaining === 0;
      return;
    }

    const chapterId = ids[cursor];
    const [chapterTitle, question, choices, correct, explanation] = chapters[chapterId];
    el("chapter-label").textContent = "Atomic Habits · Chapter " + (chapterId + 1) + " · " + chapterTitle;
    el("question-title").textContent = question;
    el("chapter-summary-link").href = danSummaryUrl + "#" + chapterSummaryFragments[chapterId];
    el("choices").replaceChildren();
    for (const [index, choice] of choices.entries()) {
      const label = document.createElement("label");
      label.className = "choice";
      const badge = document.createElement("span");
      badge.className = "letter";
      badge.setAttribute("aria-hidden", "true");
      badge.textContent = "ABCD"[index];
      const description = document.createElement("span");
      description.textContent = choice;
      const input = document.createElement("input");
      input.type = "radio";
      input.name = "choice";
      input.value = index;
      input.checked = index === (answered ? answers[cursor] : selected);
      input.disabled = answered;
      if (answered && index === correct) label.classList.add("correct");
      if (answered && input.checked && index !== correct) label.classList.add("incorrect");
      input.addEventListener("change", () => {
        selected = index;
        el("check").disabled = false;
      });
      label.append(badge, description, input);
      el("choices").append(label);
    }
    el("feedback").hidden = !answered;
    el("feedback").replaceChildren();
    if (answered) {
      const heading = document.createElement("strong");
      heading.textContent = answers[cursor] === correct ? "Correct." : "Correct answer: " + "ABCD"[correct] + ".";
      const detail = document.createElement("p");
      detail.textContent = explanation;
      el("feedback").append(heading, detail);
    }
    el("check").hidden = answered;
    el("check").disabled = selected === null;
    el("next").hidden = !answered;
    el("next").textContent = position === ids.length ? "See results →" : "Next question →";
  }

  function makeNotes() {
    for (const [index, [chapterTitle, , , , explanation]] of chapters.entries()) {
      const chapter = document.createElement("details");
      chapter.className = "chapter";
      const title = document.createElement("summary");
      title.textContent = "Chapter " + (index + 1) + " · " + chapterTitle;
      const note = document.createElement("p");
      note.textContent = explanation;
      const button = document.createElement("button");
      button.type = "button";
      button.className = "action";
      button.textContent = "Practice this chapter";
      button.addEventListener("click", () => startSession("chapter-" + index, [index]));
      chapter.append(title, note, button);
      el("notes").append(chapter);
    }
  }

  function showView(nextView, focus = false) {
    view = nextView;
    const learning = view === "learn";
    el("learn-panel").hidden = !learning;
    el("practice-panel").hidden = learning;
    el(learning ? "learn-nav" : "practice-nav").setAttribute("aria-current", "page");
    el(learning ? "practice-nav" : "learn-nav").removeAttribute("aria-current");
    renderSidebar();
    if (!learning) renderPractice();
    if (focus) el(learning ? "learn-title" : "question-title").focus();
  }

  function startSession(kind, ids) {
    if (!ids.length) return;
    selected = null;
    state.session = makeSession(kind, ids);
    saveProgress();
    showView("practice", true);
  }

  el("question-form").addEventListener("submit", event => {
    event.preventDefault();
    const { ids, cursor, answers } = state.session;
    if (selected === null || answers.length !== cursor || cursor >= ids.length) return;
    const id = ids[cursor];
    const correct = selected === chapters[id][3];
    answers.push(selected);
    if (correct || !mastered(id)) state.mastery[id] = correct ? "correct" : "missed";
    saveProgress();
    renderPractice();
    renderSidebar();
    el("next").focus({ preventScroll: true });
  });

  el("next").addEventListener("click", () => {
    const { session } = state;
    if (session.answers.length !== session.cursor + 1) return;
    session.cursor += 1;
    selected = null;
    saveProgress();
    renderPractice();
    renderSidebar();
    el("question-title").focus();
  });

  el("learn-nav").addEventListener("click", () => showView("learn", true));
  el("practice-nav").addEventListener("click", () => showView("practice", true));
  el("review").addEventListener("click", () => startSession("review", mistakes()));
  el("restart").addEventListener("click", () => startSession(state.session.kind, state.session.ids));
  el("continue-book").addEventListener("click", () => startSession("book", book.filter(id => !mastered(id))));
  makeSidebar();
  makeNotes();
  showView("practice");
  </script>
</body>
</html>
