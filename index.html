<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="60 заданий по 20 главам книги Джеймса Клира «Атомные привычки».">
  <meta name="theme-color" content="#f8f5ed">
  <title>Атомные привычки — тренажёр по книге</title>
  <style>
    :root{color-scheme:light;--paper:#f8f5ed;--ink:#112c1d;--green:#164728;--sage:#e5ead8;--line:#bdc7b4;--muted:#47604d;--gold:#c0a521;--white:#fffefa;--sans:system-ui,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.5 var(--sans)}
    button,a{-webkit-tap-highlight-color:transparent}
    button{font:inherit;cursor:pointer;color:inherit}
    a{color:var(--green);text-underline-offset:.22em}
    :focus-visible{outline:3px solid #8c6e04;outline-offset:4px}
    [hidden]{display:none!important}
    .wrap{width:min(1320px,calc(100% - 64px));margin-inline:auto}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid #849886}
    .brand{display:flex;align-items:center;gap:12px;font:bold clamp(1.2rem,3vw,1.95rem)/1 Georgia,serif;text-decoration:none}
    .mark{display:grid;place-items:center;width:42px;height:42px;border-radius:11px;background:var(--green);color:white;flex:none}
    .mark svg{width:27px;height:27px}
    nav{display:flex;align-items:center;gap:8px}
    .language-link{padding:8px 4px;font-size:.85rem;font-weight:650}
    @media(max-width:420px){header{flex-wrap:wrap}}
    nav button,.action{border:1px solid transparent;background:transparent;border-radius:9px;padding:8px 14px;font-weight:650}
    nav [aria-current="page"],.primary{background:var(--green);color:white}
    .hero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px;min-height:290px;padding:21px 25px}
    h1,h2,h3{font-family:Georgia,serif;line-height:1.12;margin:0}
    h1{font-size:clamp(2.5rem,6.3vw,6rem);letter-spacing:-.055em}
    .hero p{font:clamp(1.15rem,2.2vw,1.7rem)/1.4 Georgia,serif;margin:.7rem 0 0}
    .hero-copy::after{content:"";display:block;width:76px;height:3px;background:var(--gold);margin-top:22px}
    .diagram{width:clamp(205px,24vw,310px);margin-right:clamp(0px,5vw,72px);color:var(--green)}
    .grid{display:grid;grid-template-columns:minmax(0,1.82fr) minmax(265px,1fr);gap:18px;align-items:start}
    .card{background:var(--white);border:1px solid #637d67;border-radius:15px;padding:clamp(18px,2.6vw,33px);min-width:0}
    .sidebar{background:var(--sage);border-radius:15px;padding:clamp(16px,2vw,25px)}
    .sidebar h2,.card h2{font-size:clamp(1.55rem,3vw,2.35rem)}
    .sidebar p{margin:5px 0 13px;color:var(--muted)}
    .sidebar .small{font-size:.84rem;margin-bottom:0}
    .progress-line{display:flex;align-items:center;gap:14px;margin-bottom:17px;color:var(--muted);font-size:.86rem;font-weight:650}
    progress{width:100%;height:10px;appearance:none;overflow:hidden;border:0;border-radius:12px;background:#e1e8d9;color:var(--green)}
    progress::-webkit-progress-bar{background:#e1e8d9;border-radius:12px}
    progress::-webkit-progress-value{background:var(--green);border-radius:12px}
    progress::-moz-progress-bar{background:var(--green);border-radius:12px}
    #position{white-space:nowrap}
    .kicker{margin:0 0 7px;color:var(--muted);font-size:.85rem;font-weight:700}
    .chapter-source{margin:9px 0 0;font-size:.86rem}
    .choices{display:grid;gap:9px;margin:19px 0 0}
    .choice{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;min-height:51px}
    .choice:hover,.topic:hover,.chapter:hover{border-color:var(--green)}
    .choice:has(input:checked){border-color:#768648;background:#f4f3dc}
    .choice.correct{border-color:#53815d;background:#e8f2e4}
    .choice.incorrect{border-color:#a65040;background:#f9eae3}
    .choice:has(input:disabled){cursor:default}
    .choice input{accent-color:var(--green);width:17px;height:17px;margin:0}
    .letter{display:grid;place-items:center;border-radius:7px;width:30px;height:30px;background:var(--sage);font:bold 1.05rem Georgia,serif}
    .choice:has(input:checked) .letter{background:var(--green);color:white}
    .footer-actions{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;margin-top:17px}
    .action{min-height:42px;border-color:#a2b19b}
    .action.primary{border-color:var(--green)}
    .action:hover:not(:disabled){filter:brightness(.92)}
    .action:disabled{background:#e2e9df;color:#4f6454;border-color:transparent;cursor:default}
    .feedback{margin:16px 0 0;padding:11px 14px;border-left:3px solid #78916e;background:#eff3e9;border-radius:0 6px 6px 0}
    .feedback p{margin:3px 0 0}
    .topics{display:grid;gap:6px}
    .topic{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:11px;text-align:left;border:1px solid transparent;border-radius:10px;background:#f6f7eb;padding:8px 10px;width:100%;min-height:54px}
    .topic[aria-pressed="true"]{border-color:#78896d;background:#fffef5}
    .topic-icon{width:22px;height:22px;color:var(--green)}
    .topic strong{display:block;font:bold 1.12rem Georgia,serif}
    .topic small{display:block;color:var(--muted);font-size:.72rem}
    .count{white-space:nowrap;font-size:.8rem;font-variant-numeric:tabular-nums}
    .sidebar .action{margin-top:11px;width:100%}
    .learn-list{display:grid;gap:10px;margin-top:18px}
    .chapter{border:1px solid var(--line);border-radius:9px;padding:10px 12px}
    .chapter summary{cursor:pointer;font-weight:650}
    .chapter p{margin:10px 0}
    .chapter .action{margin-bottom:3px}
    .score{margin:15px 0 0}
    footer{margin-top:23px;margin-bottom:25px;border-top:1px solid #849886;padding:12px 0;color:var(--muted);font-size:.86rem}
    @media(max-width:780px){.wrap{width:calc(100% - 32px)}.hero{min-height:215px;padding:20px 5px}.diagram{width:150px;margin:0}.grid{grid-template-columns:1fr}.sidebar{grid-row:auto}}
    @media(max-width:470px){header{gap:6px}.mark{width:33px;height:33px}.mark svg{width:22px;height:22px}.brand{gap:7px}nav{gap:2px}nav button{padding:6px 8px}.hero{grid-template-columns:1fr;min-height:0;padding:23px 3px}.diagram{display:none}.hero-copy::after{margin-top:15px}.choice{gap:9px}}
  </style>
</head>
<body>
  <header class="wrap">
    <a class="brand" href="index.html">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="currentColor"><path d="M15 26v-9C7 19 3 13 2 7c7 0 12 3 14 9C18 10 23 7 30 7c-1 7-6 12-13 11v8z"/></svg></span>
      Привычки
    </a>
    <nav aria-label="Основная навигация">
      <a class="language-link" href="../index.html">Языки</a>
      <button id="learn-nav" type="button">Конспект</button>
      <button id="practice-nav" type="button" aria-current="page">Тест</button>
    </nav>
  </header>
  <main class="wrap">
    <section class="hero" aria-labelledby="title">
      <div class="hero-copy">
        <h1 id="title">Тренируйте привычки.</h1>
        <p>60 заданий по книге Джеймса Клира: идеи, примеры и практика.</p>
      </div>
      <svg class="diagram" viewBox="0 0 300 270" role="img" aria-label="Цикл привычки: стимул, желание, реакция, вознаграждение">
        <circle cx="150" cy="135" r="123" fill="none" stroke="#c0a521" stroke-width="3.6" stroke-dasharray="0.1 10" stroke-linecap="round"/>
        <g fill="#f8f5ed" fill-opacity=".8" stroke="currentColor" stroke-width="1.5">
          <circle cx="150" cy="72" r="64"/><circle cx="223" cy="135" r="64"/>
          <circle cx="150" cy="198" r="64"/><circle cx="77" cy="135" r="64"/>
        </g>
        <g text-anchor="middle" fill="currentColor" font-family="Georgia, serif" font-size="18" font-weight="bold">
          <text x="150" y="53">Стимул</text><text x="240" y="140">Желание</text>
          <text x="150" y="225">Реакция</text><text x="60" y="140">Награда</text>
        </g>
        <circle cx="150" cy="135" r="24" fill="#c0a521"/>
        <path fill="#fffefa" d="M149 148v-12c-8 0-13-4-14-10 8 0 13 3 15 9 2-6 7-9 15-9-1 6-6 10-14 10v12z"/>
      </svg>
    </section>
    <div class="grid">
      <section class="card" id="practice-panel" aria-label="Вопрос тренажёра">
        <div class="progress-line"><progress id="session-progress" aria-label="Прогресс тренировки"></progress><span id="position"></span></div>
        <p class="kicker" id="chapter-label"></p>
        <h2 id="question-title" tabindex="-1"></h2>
        <form id="question-form">
          <p class="chapter-source" id="question-source"></p>
          <div class="choices" id="choices" role="radiogroup" aria-labelledby="question-title"></div>
          <div class="feedback" id="feedback" role="status" hidden></div>
          <div class="footer-actions">
            <button type="submit" class="action primary" id="check" disabled>Проверить ответ</button>
            <button type="button" class="action primary" id="next" hidden>Следующий вопрос →</button>
          </div>
        </form>
        <div id="result" hidden>
          <p class="score" id="score"></p>
          <div class="footer-actions">
            <button type="button" class="action" id="restart">Пройти ещё раз</button>
            <button type="button" class="action primary" id="continue-book">Продолжить по книге →</button>
          </div>
        </div>
      </section>
      <section class="card" id="learn-panel" aria-labelledby="learn-title" hidden>
        <h2 id="learn-title" tabindex="-1">Конспект по главам</h2>
        <div class="learn-list" id="notes"></div>
      </section>
      <aside class="sidebar" aria-labelledby="progress-title">
        <h2 id="progress-title">Прогресс по книге</h2>
        <p id="book-count"></p>
        <div class="topics" id="topics"></div>
        <button id="review" class="action" type="button" disabled>Повторить ошибки</button>
        <p class="small" id="storage-status">Прогресс сохраняется в этом браузере.</p>
      </aside>
    </div>
  </main>
  <footer class="wrap">
    Источник заданий: Джеймс Клир, <a href="https://jamesclear.com/atomic-habits">«Атомные привычки»</a>, издательство «Питер», 2020.
  </footer>
  <script>
  "use strict";
  // Each chapter records the heading, source pages, takeaway, and three questions.
  const chapterContent = [
    ["Удивительная сила атомных привычек", 22, 22, "Клир начинает с истории британского велоспорта: команда улучшала множество небольших деталей. Эффект привычек накапливается, а дневная система создаёт условия для этого накопления.", [
      ["Что отличает систему от цели?",["Система задаёт повторяемый процесс, цель — желаемый результат.","Система описывает только конечный срок.","Цель работает лишь без расписания.","Система отличается только длительностью."],0,"Цель может дать направление. Система подсказывает, что именно делать сегодня и в следующие дни."],
      ["Что показывает история британских велогонщиков и подхода Дейва Брейлсфорда?",["Стоило улучшать только оснащение.","Одна выигранная гонка изменила распорядок всей команды.","Много небольших улучшений в тренировках и подготовке могут дать общий эффект.","У каждой мелочи был одинаковый вклад в победу."],2,"Команда работала и над оснащением, и над восстановлением, и над другими деталями. Отдельные изменения были малы, но складывались."],
      ["После трёх недель разговорной практики Оля пока не заметила скачка в английском. Какой вывод ближе к книге?",["У неё нет способностей к языкам.","Любой полезный повтор должен давать заметный эффект сразу.","Нужно оценивать только результат теста.","Ранние усилия могут накапливаться до того, как результат станет заметен."],3,"Клир описывает задержку между регулярной практикой и видимым результатом. Стоит наблюдать и за самой регулярностью."]
    ]],
    ["Как привычки формируют идентичность (и наоборот)", 43, 46, "В книге три уровня изменений — результат, процесс и представление о себе. Повторяемые действия дают человеку основания менять представление о том, кто он.", [
      ["Какой план начинается с идентичности?",["Прочитать 24 книги к декабрю.","Стать человеком, который регулярно читает, и начать с одной страницы в день.","Ежедневно отмечать число прочитанных страниц.","Поставить себе напоминание о чтении на 21:00."],1,"Здесь сначала выбран образ себя, а небольшое действие каждый день подтверждает его."],
      ["Почему в примере Клира ответ «Я не курю» отличается от «Я пытаюсь бросить»?",["Первый скрывает цель от окружающих.","Первый гарантирует, что желания закурить больше не будет.","Первый описывает новое представление человека о себе.","Первый обращает внимание на количество сигарет."],2,"Две реплики описывают разную идентичность. Выбранный образ легче укрепить действиями, которые ему соответствуют."],
      ["Артём хочет стать человеком, на которого можно положиться. Какой поступок даст этому больше всего оснований?",["Пообещать всем отвечать быстрее.","Опубликовать свой список ценностей.","Взять на себя ещё пять задач.","Ответить коллеге в обещанный срок и повторять это каждый раз."],3,"Выполненное небольшое обязательство служит доказательством, что Артём способен действовать в соответствии с выбранной идентичностью."]
    ]],
    ["Четыре простых шага для формирования лучших привычек", 61, 61, "Цикл привычки разбивается на стимул, желание, реакцию и вознаграждение. Эти этапы дают четыре точки, в которых можно менять поведение.", [
      ["Какой порядок отражает цикл привычки?",["Желание → стимул → вознаграждение → реакция.","Реакция → стимул → желание → вознаграждение.","Стимул → желание → реакция → вознаграждение.","Стимул → реакция → вознаграждение → желание."],2,"Сначала появляется сигнал, затем возникает ожидание изменения, человек действует и получает результат."],
      ["Какой вывод поддерживает описанный опыт Торндайка с кошками и коробкой?",["Кошки постепенно повторяли действие, которое открывало выход, и выполняли его быстрее.","Кошки запоминали решение только после того, как видели другую кошку.","Кошки ускорялись независимо от результата своих действий.","Успешное действие от опыта к опыту становилось всё менее вероятным."],0,"Животные пробовали разные действия. Действие, приводившее к выходу, закреплялось и со временем выполнялось быстрее."],
      ["Сообщение высветилось на экране, Миле захотелось узнать новости, она открыла чат и успокоилась. Что было вознаграждением?",["Уведомление.","Открытие чата.","Желание узнать новости.","Полученная информация и ощущение облегчения."],3,"Уведомление запустило цикл, а облегчение после проверки объясняет, почему ей захочется повторить реакцию."]
    ]],
    ["Человек, который плохо выглядел", 78, 82, "Привычные сигналы легко замечать автоматически. Перед изменением поведения Клир предлагает увидеть его как последовательность действий и оценить, куда она ведёт.", [
      ["Что нужно сделать с карточкой привычек?",["Сразу заменить каждый пункт новым действием.","Записать обычные действия и оценить каждое относительно желаемого направления.","Выбрать привычки с самыми большими наградами.","Расположить все действия по времени выполнения и больше ничего не делать."],1,"Смысл карточки в осознании текущего поведения. Один и тот же пункт может быть полезен или мешать в зависимости от цели."],
      ["Зачем в книге обсуждается проговаривание действий вслух, как в системе указания и называния?",["Чтобы заменить тренировки произнесением слов.","Чтобы уменьшить число видимых сигналов.","Чтобы заметить действие, которое иначе прошло бы автоматически.","Чтобы отложить принятие решения до конца дня."],2,"Когда человек называет действие в момент его выполнения, ему проще вывести его из автоматического режима."],
      ["Кирилл открывает маркетплейс в паузах между задачами. Какой первый шаг поможет увидеть закономерность?",["Два дня записывать, когда он открывает приложение и что было прямо перед этим.","Назначить себе штраф за каждое открытие.","Сразу составить список вещей, которые он купит через месяц.","Попросить друга каждый час писать ему в чат."],0,"Краткие записи помогут отличить реальные сигналы от предположений и выбрать, что менять."]
    ]],
    ["Лучший способ сформировать новую привычку", 88, 95, "Намерение реализации даёт привычке время и место. Наложение привычек использует действие, которое уже регулярно происходит, как сигнал для следующего.", [
      ["Какой план задаёт время и место нового действия?",["Буду чаще практиковать французский.","После чистки зубов повторю одно слово.","За неделю пройду три урока.","В 19:30 повторю пять слов за кухонным столом."],3,"Конкретные время и место уменьшают необходимость решать в момент старта, когда и где заниматься."],
      ["Что делает пример с медитацией после утреннего кофе наложением привычек?",["Медитация проходит в известном месте.","Приготовление кофе уже происходит регулярно и служит сигналом.","Кофе становится вознаграждением за медитацию.","Оба действия занимают одинаковое время."],1,"Привычный шаг выдаёт сигнал в нужный момент, поэтому новое действие легче встроить в распорядок."],
      ["По будням Галя каждый день вешает ключи на крючок, но ужинает в разное время. Как ей привязать запись расхода к устойчивому сигналу?",["Записывать расходы ровно в 21:00, где бы она ни была.","Записывать расходы, когда будет настроение.","Повесив ключи на крючок, записывать одну покупку.","Записывать все расходы по воскресеньям, если вспомнит."],2,"В этой ситуации возвращение домой даёт заметное, повторяемое событие и точку старта для короткой записи."]
    ]],
    ["Значение мотивации преувеличено: важность окружения", 102, 108, "Расположение предметов и значение знакомого места влияют на то, какие действия приходят на ум. Полезный сигнал стоит разместить там, где он будет виден в момент выбора.", [
      ["Что в первую очередь меняет дизайн окружения?",["Как часто и в каком месте человек замечает сигнал.","Размер отложенного вознаграждения.","То, насколько сложна сама привычка после начала.","То, сколько дней нужно для любой привычки."],0,"Окружение подсказывает, какие действия возможны прямо сейчас. Видимость сигнала повышает шанс вспомнить об этом действии."],
      ["Почему Клир предлагает оставить гитару на видном месте в гостиной?",["В гостиной всегда легче играть быстро.","Можно отказаться от повторения гамм.","Покупка подставки делает игру результативнее.","Видимая гитара чаще напоминает о возможности сыграть."],3,"Предмет превращается в напоминание там, где человек решает, чем заняться."],
      ["Соня хочет брать многоразовую сумку в магазин. Куда положить её, чтобы сигнал появлялся вовремя?",["В ящик с сезонной одеждой.","Рядом с ключами, которые она берёт перед выходом.","В дальний ящик кухни рядом с запасами.","В отдельную коробку с надписью «на потом»."],1,"Сумка рядом с ключами будет видна непосредственно перед выходом, пока её ещё можно взять."]
    ]],
    ["Секрет самоконтроля", 115, 115, "Привычная реакция может вернуться вместе со старым сигналом. Для устойчивых изменений Клир предлагает уменьшить число встреч с соблазном.", [
      ["Как применить обратную сторону первого закона?",["Добавить награду за отказ.","Определить время для новой привычки.","Убрать сигналы, которые напоминают о нежелательной привычке.","Повысить сложность действия после появления сигнала."],2,"Первый закон работает через видимость сигнала. Его инверсия уменьшает вероятность, что привычный цикл вообще запустится."],
      ["Зачем Клир рассказывает о солдатах, у которых употребление героина часто прекращалось после возвращения из Вьетнама?",["Чтобы показать, как привычку может поддерживать прежнее окружение и его сигналы.","Чтобы доказать, что среда не имеет значения.","Чтобы предложить универсальную замену любой привычки.","Чтобы показать, что привычки меняются только с возрастом."],0,"Этот пример в книге иллюстрирует связь поведения с контекстом. После возвращения домой многие прежние сигналы исчезли."],
      ["Маша постоянно проверяет новости после баннеров на телефоне. Что уменьшит именно число сигналов во время занятий?",["Установить лимит чтения новостей после открытия приложения.","Отключить баннеры новостей на время занятий.","Скрыть приложение за дополнительным паролем, но оставить уведомления.","Вести статистику открытий в конце недели."],1,"Отключение баннеров убирает внешний повод для проверки именно в тот период, когда он мешает."]
    ]],
    ["Как сделать привычку привлекательной", 124, 134, "Ожидание приятного результата может мотивировать ещё до действия. Совмещение с любимым занятием делает полезную привычку более привлекательной.", [
      ["Какой приём связывает нужное действие с желанным?",["Наложение привычек по времени суток.","Карточка привычек.","Усложнение доступа к награде.","Совмещение нужного действия с тем, которого уже ждёшь."],3,"Приятное занятие добавляет привлекательности началу нужного действия, потому что его уже хочется."],
      ["Какой принцип показывает пример студента, связавшего просмотр Netflix с велотренажёром?",["Нужным занятием следует заниматься только после достижения цели.","Лучше убрать из дома все развлечения.","Привлекательное занятие может стать поводом выполнять полезное.","Польза привычки зависит от сложности оборудования."],2,"Студент устроил просмотр так, чтобы любимое занятие стало доступно во время тренировки. Ожидание сериала побуждало начать крутить педали."],
      ["Денис любит детективные подкасты и хочет ходить пешком после работы. Как применить этот приём?",["Слушать любимый подкаст именно во время прогулки.","Послушать весь выпуск дома, а затем решить, идти ли гулять.","Купить новый плеер через месяц, если будет гулять.","Учитывать шаги в таблице вместо подкаста."],0,"Подкаст доступен сразу на прогулке, поэтому не нужно ждать отдалённого вознаграждения."]
    ]],
    ["Роль семьи и друзей в формировании привычек", 139, 139, "Близкие, большинство и люди с высоким статусом задают нормы поведения. Особенно полезна группа, в которой нужное тебе действие принято и где у тебя уже есть что-то общее с участниками.", [
      ["Какой выбор группы обычно облегчает новую привычку?",["Группа с самыми знаменитыми участниками.","Группа, где нужное действие регулярно делают люди, с которыми у тебя есть что-то общее.","Группа, где принято обсуждать цель, но не заниматься.","Группа, где новое действие вызовет у большинства удивление."],1,"Атмосфера принадлежности делает нужное поведение нормальным, а повторяющиеся встречи дают возможности его практиковать."],
      ["Зачем в главе приводится история семьи Полгар, в которой девочки росли в окружении шахмат?",["Чтобы показать, что любое детское увлечение определяется генами.","Чтобы доказать, что важнее всего турнирные награды.","Чтобы показать, что соревнования заменяют ежедневную практику.","Чтобы показать, что окружение семьи может превратить необычное для других занятие в повседневную норму."],3,"В этой семье шахматы были постоянно рядом и разделялись близкими. Это пример того, как социальная среда формирует норму."],
      ["Лена хочет начать регулярно обсуждать книги на испанском. Что поможет ей встроиться в практику?",["Выбрать форум, где участники лишь публикуют списки книг.","Читать интервью с лучшими переводчиками.","Присоединиться к клубу своего уровня, где участники каждую неделю обсуждают книгу на испанском.","Выбрать элитный клуб, где она сможет только слушать."],2,"Группа подходящего уровня делает участие доступным, а регулярные обсуждения превращают нужное действие в норму."]
    ]],
    ["Как найти и устранить причины вредных привычек", 152, 160, "За заметным желанием часто стоит ожидание определённого состояния: облегчения, уверенности или связи с другими. Можно изменить привлекательность привычки, изменив ожидаемый результат.", [
      ["Что полезно выяснить прежде всего, когда человек хочет изменить тягу к привычке?",["Сколько дней она уже существует.","Какого изменения состояния он ждёт от этого действия.","Можно ли придумать покупку, которая её заменит.","Сможет ли он назвать все четыре закона по порядку."],1,"Один и тот же мотив можно удовлетворить разными действиями. Распознав потребность, проще переоценить старый способ."],
      ["Какое переосмысление тренировок соответствует приёму из главы?",["Если тренировка тяжёлая, нужно отказаться от неё.","Польза появится только через год.","Физическая нагрузка — возможность развить выносливость и силу.","Сделаю упражнения, только если меня кто-то проконтролирует."],2,"Смысл в том, чтобы изменить не саму нагрузку, а то, с каким ожидаемым переживанием или результатом она связана."],
      ["После трудной встречи Рома листает ленту, чтобы отвлечься. Какую мысль можно использовать, чтобы сделать прогулку привлекательнее?",["Короткая прогулка даст мне передышку и позволит вернуться к работе с ясной головой.","Мне обязательно нужно сделать десять тысяч шагов.","Я запрещаю себе смотреть на телефон.","Буду записывать каждое открытие ленты."],0,"Мысль связывает прогулку с тем результатом, которого Рома уже хочет, — быстрым переходом от напряжения к отдыху."]
    ]],
    ["Идти медленно, но назад — никогда", 166, 166, "Подготовка может облегчить старт. Автоматизм развивается через повторение самого действия, а не через время, потраченное на обсуждение будущей практики.", [
      ["Какой признак важнее для формирования автоматизма?",["Сколько раз человек реально сделал нужное действие.","Сколько прошло дней с момента выбора цели.","Насколько подробно написан план.","Сколько материалов о привычке прочитано."],0,"Важны фактические повторения. Тридцать дней размышлений не дают такого же опыта, как тридцать выполненных действий."],
      ["Что иллюстрирует история учебных групп по фотографии, где одна группа снимала много, а другая стремилась к одному идеальному снимку?",["Для мастерства достаточно заранее выбрать лучшую камеру.","Подготовка важнее работы с реальными кадрами.","Ставить количественные цели полезно для любой работы без исключений.","Много попыток дают практику и обратную связь, которые могут улучшить качество."],3,"Каждая съёмка позволяла попробовать новое и увидеть результат. Практика дала группе опыт, который трудно получить одной подготовкой."],
      ["Вика хочет научиться писать короткие рассказы. Что даст ей практику в самом действии?",["Составить таблицу конкурсов.","Написать сегодня одну короткую сцену.","Купить новый блокнот.","Пересмотреть три урока о сюжетах."],1,"Сцена — реальное упражнение в письме. Остальные действия могут подготовить к нему, но сами по себе не тренируют написание текста."]
    ]],
    ["Закон наименьшего усилия", 174, 184, "Чем меньше действий отделяет человека от привычки, тем легче начать. Полезно заранее подготовить среду для следующего повторения или добавить препятствие для ненужного действия.", [
      ["Что лучше всего объясняет уменьшение трения?",["Повысить личную ответственность обещанием.","Оценить успех через месяц.","Убрать лишние шаги между намерением и действием.","Выбрать более приятную награду."],2,"Трение — конкретные усилия и шаги по пути к действию. Их можно менять независимо от силы желания."],
      ["Зачем в главе предлагают вынимать батарейки из пульта после просмотра телевизора?",["Чтобы каждый новый просмотр требовал дополнительного шага.","Чтобы телевизор перестал быть виден.","Чтобы просмотр стал приятнее.","Чтобы лучше запомнить передачу."],0,"Чтобы снова включить телевизор, придётся поставить батарейки на место. Даже небольшая задержка даёт шанс выбрать другое действие."],
      ["Саша пропускает спортзал, потому что нужно ехать туда отдельным автобусом. Как снизить трение?",["Поставить цель тренироваться вдвое чаще.","Пообещать другу отчитаться.","Сохранить старый маршрут, но придумать награду.","Выбрать зал, мимо которого он уже идёт домой."],3,"Зал на обычном маршруте убирает лишнюю дорогу из каждого повторения."]
    ]],
    ["Правило двух минут", 186, 186, "Начальный вариант новой привычки должен быть настолько простым, чтобы его можно было выполнить почти сразу. Такой шаг служит входом в более длинное действие.", [
      ["Какую задачу решает правило двух минут?",["Помогает выполнять любое занятие целиком за две минуты.","Уменьшает порог входа в нужное действие.","Задаёт максимальное время практики на будущее.","Увеличивает награду за завершение."],1,"Две минуты относятся к начальной версии. Когда действие уже началось и закрепилось, его можно расширять."],
      ["Почему для хореографа Твайлы Тарп важным началом тренировочного дня был вызов такси или посадка в него?",["В такси заменялась сама тренировка.","Дорога служила наградой после тренировки.","Простой начальный шаг направлял её к тренировке.","Она оставляла выбор места тренировки до конца поездки."],2,"Решение отправиться в зал заранее направляло дальнейшие действия. Маленький ритуал запускал более длинную последовательность."],
      ["Илья откладывает получасовые занятия на гитаре. Что лучше подходит как начальная версия привычки?",["Взять гитару и сыграть один аккорд.","Прочитать биографию гитариста за две минуты.","Выбрать час для воскресной репетиции.","Купить новый комплект струн."],0,"Один аккорд уже является практикой игры. Он создаёт простой старт для более длинного занятия."]
    ]],
    ["Как сделать хорошие привычки неизбежными, а плохие — невозможными", 197, 197, "Предварительное обязательство ограничивает будущий выбор, пока соблазн ещё не возник. Разовое изменение или автоматизация может влиять на множество последующих решений.", [
      ["Чем предварительное обязательство отличается от обычного обещания?",["В нём обязательно участвует посторонний человек.","Оно всегда предполагает денежный штраф.","Его принимают только после нарушения.","Оно заранее меняет доступные варианты будущего поведения."],3,"Устройство работает, когда будущему человеку уже труднее выбрать старый вариант, даже если намерение ослабнет."],
      ["Что показывает история Виктора Гюго, который попросил убрать его одежду, чтобы закончить роман?",["Как наградить себя сразу после письма.","Как ограничить соблазн выйти из дома, пока работа не сделана.","Как повысить интерес к прогулке после работы.","Как выполнить роман с помощью списка дел."],1,"Гюго изменил условия заранее: выйти стало сложнее, поэтому больше времени оставалось на рукопись."],
      ["Катя хочет учиться по вечерам, но часто переключается на сериалы. Какое действие заранее ограничивает её выбор?",["Договориться, что блокировщик будет закрывать сайт в учебные часы, а код хранится у друга.","Поставить рядом с ноутбуком записку о целях.","Обещать себе посмотреть серию после учёбы.","В конце месяца подсчитать часы просмотра."],0,"Запланированная блокировка меняет доступ к сайту во время занятий, когда сопротивляться соблазну труднее."]
    ]],
    ["Главное правило изменения поведения", 210, 211, "Отдалённый результат полезной привычки редко чувствуется сегодня. Небольшое быстрое подкрепление помогает повторять действие, пока основная польза ещё не видна.", [
      ["Какое подкрепление лучше поддерживает привычку в начале?",["Самое далёкое по времени.","Такое, которое появляется сразу и согласуется с целью.","То, которое требует дополнительной тяжёлой работы.","То, которое делает исходную цель менее важной."],1,"Быстрый положительный результат связывается с только что выполненным действием. Подходящая награда поддерживает долгосрочную цель."],
      ["Какую роль в примере Клира с мытьём рук играло приятное в использовании мыло?",["Оно заставило людей запоминать больше правил.","Оно сократило необходимое число мытья рук.","Оно заменило напоминания денежным штрафом.","Оно сделало мытьё рук приятнее сразу после использования."],3,"Приятное ощущение делает действие удовлетворительным уже сейчас. Польза для здоровья проявляется позже и может оставаться незаметной."],
      ["У Пети цель сэкономить за год, готовя дома. Что даст быстрое подкрепление и поддержит цель?",["Сразу после домашнего ужина перекладывать небольшую сумму в накопления на поездку.","Ждать декабря, чтобы посчитать экономию.","Покупать дорогой десерт после каждого домашнего ужина.","Повышать целевую сумму после каждого приёма пищи."],0,"Видимое пополнение накоплений даёт ощущение результата уже сегодня и движет Петю в нужную сторону."]
    ]],
    ["Хорошие привычки каждый день", 224, 224, "Запись сразу после действия делает продвижение видимым. Если один повтор пропущен, главная задача — вернуться к привычке в ближайший подходящий момент.", [
      ["Как вести журнал так, чтобы он поддерживал привычку?",["Записывать примерное число повторов раз в месяц.","Использовать только длинное текстовое описание.","Ставить отметку сразу после выполнения действия.","Переносить запись до появления результата."],2,"Своевременная отметка даёт простую обратную связь и видимое свидетельство прогресса."],
      ["Зачем в книге приведён пример перекладывания скрепок после каждого рабочего звонка?",["Чтобы увидеть каждый завершённый повтор без сложных подсчётов.","Чтобы отвлечься от звонков, когда становится скучно.","Чтобы делать звонки строго в одинаковое время.","Чтобы оценивать качество разговора по весу скрепок."],0,"Переложенная скрепка превращает невидимое повторение в заметный результат, сразу показывая, сколько уже сделано."],
      ["Оля ведёт дневник каждый вечер, но вчера пропустила. Что она может сделать сегодня?",["Подождать воскресенья и начать новую серию.","Заменить дневник другим занятием.","Написать двойной объём завтра.","Сегодня записать хотя бы одну фразу и вернуться к распорядку."],3,"Лёгкая версия сегодня помогает не превращать случайный пропуск в новую последовательность пропусков."]
    ]],
    ["Как друзья могут помочь в овладении привычками", 237, 241, "Партнёр по отчётности помогает увидеть последствия выбора сразу. Договор о привычке уточняет, что считать выполнением и что произойдёт при нарушении.", [
      ["Что делает договор о привычке конкретным?",["Описание желательного действия, способ проверки и заранее оговорённое последствие.","Обещание когда-нибудь изменить поведение.","Перечень возможных наград без срока.","Календарь, который никто не использует."],0,"Конкретный договор делает обязательство проверяемым и связывает невыполнение с понятным последствием."],
      ["Что усиливало обязательство Брайана Харриса в описанном договоре?",["Он держал точные условия в секрете.","Условия были известны другим участникам, а нарушение имело оговорённую цену.","Он принимал решение каждый вечер с нуля.","Договор не указывал, какие действия считать выполненными."],1,"Окружающие могли заметить невыполнение, а заранее известное последствие действовало раньше отдалённого результата."],
      ["Миша регулярно опаздывает на встречи учебной группы. Какой план добавит отчётность?",["Составить список причин опозданий без дальнейших действий.","Начать отмечать время прибытия только в личном календаре.","Записать общую цель лучше учиться.","Сообщать напарнику о прибытии и заранее согласиться убирать аудиторию после опоздания."],3,"Напарник видит, выполнено ли обязательство, а согласованное действие связывает опоздание с быстрым последствием."]
    ]],
    ["Правда о таланте (когда гены важны, а когда нет)", 248, 248, "Способности и интересы влияют на то, какие варианты привычки легко поддерживать. Полезно пробовать разные форматы и опираться на тот, который подходит именно тебе.", [
      ["Что советует Клир, если привычку можно выполнять разными способами?",["Всегда выбирать самый популярный вариант.","Использовать только самый трудный формат.","Искать версию, которая соответствует твоим способностям и интересам.","Постоянно менять формат, чтобы ни в одном не накапливался опыт."],2,"Хорошее соответствие повышает шанс повторения и оставляет место для развития. Практика всё равно нужна."],
      ["Почему в книге рядом обсуждаются пловец Майкл Фелпс и бегун Хишам Эль-Герруж?",["Чтобы показать, что разные телосложения дают преимущества в разных дисциплинах.","Чтобы доказать, что у пловцов и бегунов одинаковые требования.","Чтобы свести спортивный результат только к тренировочной программе.","Чтобы показать, что рост определяет исход любого соревнования."],0,"Одинаковые характеристики не дают одинакового преимущества в разных задачах. Сравнение показывает важность выбора подходящей области."],
      ["Лера хочет регулярно двигаться, любит пешие маршруты и быстро теряет интерес в зале. Что лучше проверить первым?",["Скопировать программу группы с самыми высокими результатами.","Выбрать только упражнения с максимальным расходом энергии.","Менять спорт каждый день, не замечая, что ей подходит.","Запланировать регулярный пеший маршрут посильной сложности."],3,"Маршрут опирается на уже существующий интерес и даёт реалистичный способ повторять нагрузку."]
    ]],
    ["Правило Златовласки: как оставаться мотивированным в жизни и на работе", 262, 262, "Умеренно трудная задача поддерживает интерес: успех возможен, но для него придётся постараться. Даже хорошая привычка со временем становится скучной, поэтому важна готовность продолжать.", [
      ["Какая задача находится в зоне оптимальной сложности?",["Та, которая давно не требует внимания.","Та, которая немного сложнее привычного, но остаётся посильной.","Та, решение которой неизвестно даже специалистам.","Любая случайная задача без обратной связи."],1,"Доступная трудность даёт шанс на продвижение, а небольшой вызов удерживает внимание."],
      ["Что показывает история Стива Мартина о развитии его комедийных выступлений?",["Успех обеспечила одна неожиданная реплика.","Он избегал повторения, чтобы никогда не скучать.","Полезнее всего было сразу перейти к выступлениям высокого уровня.","Мастерство складывалось из многолетней практики и постепенного изменения материала."],3,"Постоянная работа и постепенное усложнение сопровождали рост Мартина. Клир связывает эту историю и с готовностью работать после исчезновения новизны."],
      ["Дима легко решает начальные шахматные задачи, а мастерские пока даже не понимает. Что выбрать для следующей недели?",["Случайные задачи без уровня и обратной связи.","Начальные задачи, решения которых он помнит.","Задачи на один уровень выше привычных.","Только мастерские задачи."],2,"Следующий уровень растягивает текущий навык, оставляя возможность понять решение и увидеть прогресс."]
    ]],
    ["Обратная сторона хороших привычек", 272, 275, "Автоматизм освобождает внимание, но иногда скрывает мелкие ошибки. Наблюдение за результатом и точечная практика помогают выйти из застывшей рутины.", [
      ["Зачем регулярно анализировать привычку, которая уже стала лёгкой?",["Чтобы поддерживать навык и заметить ошибки, которые привычное выполнение начало скрывать.","Чтобы каждый раз полностью менять распорядок.","Чтобы заменить практику отчётами.","Чтобы исключить любые действия, которые стали автоматическими."],0,"Автоматический навык даёт основу, а анализ показывает, какой элемент требует дополнительной осознанной работы."],
      ["Зачем в главе описана система Пэта Райли для сравнения игры баскетболистов с их собственными показателями?",["Чтобы сравнивать игроков только с соперниками.","Чтобы тренеры перестали наблюдать за играми.","Чтобы отслеживать личное продвижение и находить место для следующего улучшения.","Чтобы считать достаточным любое повторение прежнего результата."],2,"Сравнение с личной базой давало обратную связь по прогрессу. Уже освоенный уровень становился отправной точкой для следующего."],
      ["Юля месяцами играет пьесу одинаково и повторяет ошибку в одном такте. Что ей поможет?",["Увеличить время и повторять пьесу как раньше.","Контролировать только число дней практики.","Каждую неделю начинать новый инструмент.","Послушать запись, выделить этот такт и отработать его с обратной связью."],3,"Изолировать сложный фрагмент — способ работать над тем, что устоявшийся навык скрывает при обычном проигрывании."]
    ]]
  ];
  const chapters = chapterContent.flatMap(([, , , , questions], chapterId) =>
    questions.map(([question, choices, correct, explanation], exerciseId) =>
      [chapterId, question, choices, correct, explanation, exerciseId])
  );
  const exerciseTypes = ["Понимание идеи", "Пример из книги", "Применение"];
  const groups = [
    { title: "Основные принципы", summary: "Системы, идентичность и цикл привычки", icon: "book", start: 0, end: 3 },
    { title: "Сделайте стимул очевидным", summary: "Замечайте сигналы и меняйте окружение", icon: "eye", start: 3, end: 7 },
    { title: "Сделайте привычку привлекательной", summary: "Учитывайте желание и влияние окружения", icon: "heart", start: 7, end: 10 },
    { title: "Упростите действие", summary: "Уберите лишние шаги на пути к началу", icon: "bolt", start: 10, end: 14 },
    { title: "Сделайте результат приятным", summary: "Закрепляйте полезные действия", icon: "gift", start: 14, end: 17 },
    { title: "Дальнейшее развитие", summary: "Подбирайте нагрузку и анализируйте результат", icon: "target", start: 17, end: 20 }
  ];
  const iconPaths = {
    book: '<path d="M12 6c-3-2-6-2-9-1v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1v14"/>',
    eye: '<path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/>',
    heart: '<path d="M12 20s-9-5.5-9-11a4.5 4.5 0 0 1 9-1 4.5 4.5 0 0 1 9 1c0 5.5-9 11-9 11Z"/>',
    bolt: '<path d="m13 2-9 12h7l-1 8 10-12h-7l1-8Z"/>',
    gift: '<path d="M4 10h16v11H4zM2 6h20v4H2zM12 6v15m0-15c-1-5-7-5-6 0m6 0c1-5 7-5 6 0"/>',
    target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>'
  };
  const book = chapters.map((chapter, index) => index);
  const storageKey = "habit-practice-ru-v1";
  const el = id => document.getElementById(id);
  let storageAvailable = true;
  let view = "practice";
  let selected = null;

  function makeSession(kind, ids) {
    return { kind, ids, answers: [], cursor: 0 };
  }

  function readProgress() {
    const empty = { mastery: {}, session: makeSession("book", book) };
    try {
      const raw = localStorage.getItem(storageKey);
      if (!raw) return empty;
      const { mastery, session } = JSON.parse(raw);
      const validChoice = choice => Number.isInteger(choice) && choice >= 0 && choice < 4;
      if (!mastery || typeof mastery !== "object" || !session ||
          !Array.isArray(session.ids) || !session.ids.length ||
          !session.ids.every(id => book.includes(id)) ||
          !Array.isArray(session.answers) || !session.answers.every(validChoice) ||
          !Number.isInteger(session.cursor) || session.cursor < 0 ||
          session.cursor > session.ids.length ||
          session.answers.length < session.cursor ||
          session.answers.length > Math.min(session.cursor + 1, session.ids.length)) return empty;
      return { mastery, session };
    } catch (error) {
      if (error instanceof SyntaxError || error instanceof TypeError) return empty;
      storageAvailable = false;
      return empty;
    }
  }

  let state = readProgress();

  function saveProgress() {
    try {
      localStorage.setItem(storageKey, JSON.stringify(state));
      storageAvailable = true;
    } catch {
      storageAvailable = false;
    }
  }

  function mastered(id) {
    return state.mastery[id] === "correct";
  }

  function mistakes() {
    return book.filter(id => state.mastery[id] === "missed");
  }

  function chapterQuestionIds(chapterId) {
    return book.filter(id => chapters[id][0] === chapterId);
  }

  function groupIds(index) {
    const { start, end } = groups[index];
    return book.filter(id => chapters[id][0] >= start && chapters[id][0] < end);
  }

  function activeGroup() {
    const { ids, cursor } = state.session;
    const chapterId = chapters[ids[cursor] ?? ids.at(-1)][0];
    return groups.findIndex(group => chapterId >= group.start && chapterId < group.end);
  }

  function makeSidebar() {
    for (const [index, group] of groups.entries()) {
      const button = document.createElement("button");
      button.className = "topic";
      button.type = "button";
      button.innerHTML = '<svg class="topic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        iconPaths[group.icon] + '</svg><span><strong>' + group.title + '</strong><small>' +
        group.summary + '</small></span><span class="count"></span>';
      button.addEventListener("click", () => {
        if (state.session.kind === "topic-" + index && state.session.cursor < state.session.ids.length) {
          showView("practice", true);
          return;
        }
        startSession("topic-" + index, groupIds(index));
      });
      el("topics").append(button);
    }
  }

  function renderSidebar() {
    const done = chapterContent.filter((chapter, chapterId) =>
      chapterQuestionIds(chapterId).every(mastered)
    ).length;
    el("book-count").textContent = "Освоено " + done + " из " + chapterContent.length + " глав. Решено " + book.filter(mastered).length + " из " + book.length + " заданий.";

    for (const [index, button] of [...el("topics").children].entries()) {
      const ids = groupIds(index);
      const doneInGroup = ids.filter(mastered).length;
      const count = button.querySelector(".count");
      count.textContent = doneInGroup + " / " + ids.length + " ›";
      count.setAttribute("aria-label", "Решено " + doneInGroup + " из " + ids.length + " заданий");
      button.setAttribute("aria-pressed", String(view === "practice" && index === activeGroup()));
    }
    const missed = mistakes().length;
    el("review").textContent = missed ? "Повторить ошибки (" + missed + ")" : "Повторить ошибки";
    el("review").disabled = missed === 0;
    el("storage-status").textContent = storageAvailable
      ? "Прогресс сохраняется в этом браузере."
      : "Хранилище браузера недоступно. Прогресс сохранится до закрытия страницы.";
  }

  function renderPractice() {
    const { ids, cursor, answers } = state.session;
    const finished = cursor === ids.length;
    const answered = answers.length > cursor;
    const position = Math.min(cursor + 1, ids.length);
    el("session-progress").max = ids.length;
    el("session-progress").value = answers.length;
    el("position").textContent = position + " из " + ids.length;
    el("question-form").hidden = finished;
    el("result").hidden = !finished;
    if (finished) {
      const correct = ids.filter((id, offset) => answers[offset] === chapters[id][3]).length;
      const remaining = book.filter(id => !mastered(id)).length;
      el("chapter-label").textContent = remaining ? "Тренировка завершена" : "Книга пройдена";
      el("question-title").textContent = remaining ? "Тренировка завершена." : "Вы освоили все 20 глав.";
      el("score").textContent = "Правильных ответов за тренировку: " + correct + " из " + ids.length + ".";
      el("continue-book").hidden = remaining === 0;
      return;
    }

    const [chapterId, question, choices, correct, explanation, exerciseId] = chapters[ids[cursor]];
    const [chapterTitle, page, examplePage] = chapterContent[chapterId];
    el("chapter-label").textContent = "Глава " + (chapterId + 1) + " · " + chapterTitle;
    el("question-title").textContent = question;
    el("question-source").textContent = exerciseTypes[exerciseId] + " · " +
      (exerciseId === 1 ? "с. " + examplePage : "Глава начинается на с. " + page);
    el("choices").replaceChildren();
    for (const [index, choice] of choices.entries()) {
      const label = document.createElement("label");
      label.className = "choice";
      const badge = document.createElement("span");
      badge.className = "letter";
      badge.setAttribute("aria-hidden", "true");
      badge.textContent = "АБВГ"[index];
      const description = document.createElement("span");
      description.textContent = choice;
      const input = document.createElement("input");
      input.type = "radio";
      input.name = "choice";
      input.value = index;
      input.checked = index === (answered ? answers[cursor] : selected);
      input.disabled = answered;
      if (answered && index === correct) label.classList.add("correct");
      if (answered && input.checked && index !== correct) label.classList.add("incorrect");
      input.addEventListener("change", () => {
        selected = index;
        el("check").disabled = false;
      });
      label.append(badge, description, input);
      el("choices").append(label);
    }
    el("feedback").hidden = !answered;
    el("feedback").replaceChildren();
    if (answered) {
      const heading = document.createElement("strong");
      heading.textContent = answers[cursor] === correct ? "Верно." : "Правильный ответ: " + "АБВГ"[correct] + ".";
      const detail = document.createElement("p");
      detail.textContent = explanation;
      el("feedback").append(heading, detail);
    }
    el("check").hidden = answered;
    el("check").disabled = selected === null;
    el("next").hidden = !answered;
    el("next").textContent = position === ids.length ? "Посмотреть результат →" : "Следующий вопрос →";
  }

  function makeNotes() {
    for (const [index, [chapterTitle, page, , explanation]] of chapterContent.entries()) {
      const chapter = document.createElement("details");
      chapter.className = "chapter";
      const title = document.createElement("summary");
      title.textContent = "Глава " + (index + 1) + " · " + chapterTitle + " · с. " + page;
      const note = document.createElement("p");
      note.textContent = explanation;
      const button = document.createElement("button");
      button.type = "button";
      button.className = "action";
      button.textContent = "Решить задания главы";
      button.addEventListener("click", () => startSession("chapter-" + index, chapterQuestionIds(index)));
      chapter.append(title, note, button);
      el("notes").append(chapter);
    }
  }

  function showView(nextView, focus = false) {
    view = nextView;
    const learning = view === "learn";
    el("learn-panel").hidden = !learning;
    el("practice-panel").hidden = learning;
    el(learning ? "learn-nav" : "practice-nav").setAttribute("aria-current", "page");
    el(learning ? "practice-nav" : "learn-nav").removeAttribute("aria-current");
    renderSidebar();
    if (!learning) renderPractice();
    if (focus) el(learning ? "learn-title" : "question-title").focus();
  }

  function startSession(kind, ids) {
    if (!ids.length) return;
    selected = null;
    state.session = makeSession(kind, ids);
    saveProgress();
    showView("practice", true);
  }

  el("question-form").addEventListener("submit", event => {
    event.preventDefault();
    const { ids, cursor, answers } = state.session;
    if (selected === null || answers.length !== cursor || cursor >= ids.length) return;
    const id = ids[cursor];
    const correct = selected === chapters[id][3];
    answers.push(selected);
    if (correct || !mastered(id)) state.mastery[id] = correct ? "correct" : "missed";
    saveProgress();
    renderPractice();
    renderSidebar();
    el("next").focus({ preventScroll: true });
  });

  el("next").addEventListener("click", () => {
    const { session } = state;
    if (session.answers.length !== session.cursor + 1) return;
    session.cursor += 1;
    selected = null;
    saveProgress();
    renderPractice();
    renderSidebar();
    el("question-title").focus();
  });

  el("learn-nav").addEventListener("click", () => showView("learn", true));
  el("practice-nav").addEventListener("click", () => showView("practice", true));
  el("review").addEventListener("click", () => startSession("review", mistakes()));
  el("restart").addEventListener("click", () => startSession(state.session.kind, state.session.ids));
  el("continue-book").addEventListener("click", () => startSession("book", book.filter(id => !mastered(id))));
  makeSidebar();
  makeNotes();
  showView("practice");
  </script>
</body>
</html>
